services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sport_local}
      POSTGRES_DB: ${POSTGRES_DB:-sport}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - prot_api_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: development
    environment: &database-env
      DATABASE_URL: postgres://${POSTGRES_USER:-sport}:${POSTGRES_PASSWORD:-sport_local}@db:5432/${POSTGRES_DB:-sport}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]

  api:
    build:
      context: .
      target: runtime
    environment:
      <<: *database-env
      PORT: 3000
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  demo:
    profiles: ["tools"]
    build:
      context: .
      target: development
    environment:
      <<: *database-env
      API_URL: http://api:3000
    volumes:
      - ./docs/captures:/app/docs/captures
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["npm", "run", "demo"]

  test-db:
    profiles: ["test"]
    image: postgres:18
    environment:
      POSTGRES_USER: sport_test
      POSTGRES_PASSWORD: sport_test
      POSTGRES_DB: sport_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport_test -d sport_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    profiles: ["test"]
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgres://sport_test:sport_test@test-db:5432/sport_test
      NODE_ENV: test
    depends_on:
      test-db:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && npm run check && npm test"]

volumes:
  prot_api_data:
